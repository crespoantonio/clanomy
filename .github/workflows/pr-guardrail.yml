name: PR Integrity & Guardrail Check

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

jobs:
  guardrail:
    name: Check Protected Payment & Security Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Changed Files
        id: check_diff
        run: |
          # Compare PR branch with the target base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Comparing changes between $BASE_SHA and $HEAD_SHA..."
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Protected files/paths list for payments, monetization, security, and branding:
          # - Payment and billing services
          # - Lemon Squeezy webhook routes and API endpoints
          # - Subscription and tier configurations
          # - Payment database migrations
          # - Payment test suites
          # - Monetization strategy documentation & licensing
          # - GitHub workflows and CI security rules
          PROTECTED_PATTERNS=(
            "^README\.md$"
            "^LICENSE$"
            "^\.env\.example$"
            "^src/services/subscription_service\.py$"
            "^src/services/billing/"
            "^src/api/routes/lemonsqueezy\.py$"
            "^src/core/subscription_config\.py$"
            "^alembic/versions/.*lemonsqueezy.*"
            "^docs/monetization-and-subscription-strategy\.md$"
            "^tests/services/test_lemonsqueezy_billing\.py$"
            "^tests/services/test_subscription_service\.py$"
            "^\.github/workflows/"
          )

          VIOLATIONS=()
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          echo "Evaluating PR submitted by: $PR_AUTHOR"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if echo "$file" | grep -Eq "$pattern"; then
                VIOLATIONS+=("$file")
                break
              fi
            done
          done <<< "$CHANGED_FILES"

          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "::error::PR touches protected payment, billing, or security files restricted from pull request modifications:"
            for v in "${VIOLATIONS[@]}"; do
              echo "  - $v"
            done
            echo ""
            echo "Modifications to billing logic, payment webhooks, subscription tiers, payment migrations, CI workflows, or core licensing are strictly restricted. Please see CONTRIBUTING.md."
            exit 1
          fi

          echo "All changed files passed guardrail checks."
